general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

# 10min - lock the screen
listener {
    timeout = 600                                # 10min
    on-timeout = loginctl lock-session           # lock screen when timeout has passed
}

# 20min - dim backlight + turn off keyboard backlight
listener {
    timeout = 1200                               # 20min
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 1200                                         # 20min
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

# 20min + 5s - turn off screen (DPMS) on both AC and battery
listener {
    timeout = 1205                                                    # 20min 5s
    on-timeout = hyprctl dispatch dpms off                            # screen off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r          # screen on when activity is detected
}

# 30min - suspend only on battery
listener {
    timeout = 1800                                # 30min
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/AC/online)" = "0" ] && systemctl suspend'  # suspend only on battery
}
