# hyprpaper config (hyprlang format)

# Wallpaper for all monitors (empty monitor = all)
wallpaper {
    monitor =
    path = /home/bdryanovski/Pictures/malachite.jpg
}

# Per-monitor example (uncomment and adjust if needed):
# wallpaper {
#     monitor = DP-1
#     path = /path/to/wallpaper1.jpg
# }

# Disable the hyprland splash overlay
splash = 0

# Enable IPC (allows changing wallpaper at runtime via hyprctl)
ipc = 1
